# This is a Declarative Automation Bundle definition for dbx_buldle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dbx_buldle
  uuid: 683e3a48-24af-4e90-8b6f-9fa32698ad86

include:
  - resources/*.job.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-9c2c10ef-bf9a.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-9c2c10ef-bf9a.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/6572d669-3173-452d-b87d-7c2ce8b0e311 to make sure we only have a single copy.
      root_path: /Workspace/Users/6572d669-3173-452d-b87d-7c2ce8b0e311/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - service_principal_name: 6572d669-3173-452d-b87d-7c2ce8b0e311
        level: CAN_MANAGE
