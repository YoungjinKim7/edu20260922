resources:
  jobs:
    online_retail_job:
      name: online_retail_job
      tasks:
        - task_key: create_bronze
          notebook_task:
            notebook_path: ../src/create_table_bronze.ipynb
            source: WORKSPACE
        - task_key: create_silver
          depends_on:
            - task_key: create_bronze
          notebook_task:
            notebook_path: ../src/create_table_silver.ipynb
            source: WORKSPACE
        - task_key: create_gold
          depends_on:
            - task_key: create_silver
          notebook_task:
            notebook_path: ../src/create_table_gold.ipynb
            source: WORKSPACE
      queue:
        enabled: true
      run_as:
        service_principal_name: 6572d669-3173-452d-b87d-7c2ce8b0e311
      performance_target: PERFORMANCE_OPTIMIZED